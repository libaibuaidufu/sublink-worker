name: Auto Sync Upstream

on:
  schedule:
    # 每周一 UTC 0:00 运行（北京时间周一早上 8:00）
    - cron: '0 0 * * 1'
  # 保留手动触发按钮，随时可以在 Actions 页面手动点 Run
  workflow_dispatch:

# 赋予 GitHub Actions 读取和写入代码库的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        uses: aahill/pull-upstream-action@v1.0.1
        with:
          upstream_repo: "7Sageer/sublink-worker"
          upstream_branch: "main"
          branch: "main"
          token: ${{ secrets.GITHUB_TOKEN }}
